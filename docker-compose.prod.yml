# Prod overrides: built artifacts only, no bind mounts, nginx reverse proxy in front.
version: "3.9"

services:
  backend:
    build:
      target: production
    command: npm run start
    environment:
      NODE_ENV: production

  ai-service:
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2
    environment:
      ENV: production

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
