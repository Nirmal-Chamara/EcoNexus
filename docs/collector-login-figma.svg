<svg width="390" height="844" viewBox="0 0 390 844" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Mobile Device Canvas Frame Background -->
  <rect width="390" height="844" rx="40" fill="#0A0F0D"/>

  <!-- Subtle Top Decorative Glow -->
  <circle cx="195" cy="40" r="140" fill="#22C55E" fill-opacity="0.12" filter="blur(60px)"/>
  <circle cx="320" cy="180" r="100" fill="#F59E0B" fill-opacity="0.08" filter="blur(50px)"/>

  <!-- Status Bar Mock -->
  <text x="32" y="38" fill="#F0FDF4" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="600">9:41</text>
  <g transform="translate(320, 26)">
    <!-- Battery & Signal Icons Mock -->
    <rect x="0" y="4" width="3" height="8" rx="1" fill="#F0FDF4"/>
    <rect x="5" y="2" width="3" height="10" rx="1" fill="#F0FDF4"/>
    <rect x="10" y="0" width="3" height="12" rx="1" fill="#F0FDF4"/>
    <rect x="18" y="1" width="22" height="11" rx="3" stroke="#F0FDF4" stroke-width="1.5" fill="none"/>
    <rect x="20" y="3" width="14" height="7" rx="1.5" fill="#22C55E"/>
    <rect x="41" y="4" width="1.5" height="4" rx="0.75" fill="#F0FDF4"/>
  </g>

  <!-- Top Logo / Emblem -->
  <g transform="translate(165, 80)">
    <rect width="60" height="60" rx="18" fill="#111A14" stroke="#1F3022" stroke-width="1.5"/>
    <!-- Eco Leaf / Recycle Icon in Collector Amber & Green -->
    <path d="M30 18C23 18 19 24 20 31C21 38 27 42 34 41C39 40 42 35 41 29C40 21 33 18 30 18Z" fill="#22C55E"/>
    <path d="M22 34C26 31 31 29 38 27" stroke="#0A0F0D" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="41" cy="20" r="4" fill="#F59E0B"/>
  </g>

  <!-- Header Text -->
  <!-- Collector Role Badge -->
  <g transform="translate(115, 156)">
    <rect width="160" height="28" rx="14" fill="#1C1607" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="16" cy="14" r="3.5" fill="#F59E0B"/>
    <text x="28" y="18" fill="#F59E0B" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">COLLECTOR PORTAL</text>
  </g>

  <text x="195" y="218" text-anchor="middle" fill="#F0FDF4" font-family="Inter, -apple-system, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5">Welcome Back, Driver</text>
  <text x="195" y="242" text-anchor="middle" fill="#6B7280" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="400">Sign in to manage active routes and pickups</text>

  <!-- Vehicle Fleet Selector Row -->
  <g transform="translate(24, 268)">
    <text x="0" y="12" fill="#A7F3D0" font-family="Inter, -apple-system, sans-serif" font-size="11" font-weight="700" letter-spacing="0.5">SELECT FLEET TYPE</text>

    <!-- Truck (Active) -->
    <rect x="0" y="22" width="78" height="54" rx="10" fill="#1C1607" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="39" y="47" text-anchor="middle" font-size="16">🚛</text>
    <text x="39" y="66" text-anchor="middle" fill="#F59E0B" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="700">Truck</text>

    <!-- Van -->
    <rect x="88" y="22" width="78" height="54" rx="10" fill="#111A14" stroke="#1F3022" stroke-width="1"/>
    <text x="127" y="47" text-anchor="middle" font-size="16">🚐</text>
    <text x="127" y="66" text-anchor="middle" fill="#6B7280" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="500">Van</text>

    <!-- 3-Wheeler -->
    <rect x="176" y="22" width="78" height="54" rx="10" fill="#111A14" stroke="#1F3022" stroke-width="1"/>
    <text x="215" y="47" text-anchor="middle" font-size="16">🛺</text>
    <text x="215" y="66" text-anchor="middle" fill="#6B7280" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="500">3-Wheeler</text>

    <!-- Bicycle -->
    <rect x="264" y="22" width="78" height="54" rx="10" fill="#111A14" stroke="#1F3022" stroke-width="1"/>
    <text x="303" y="47" text-anchor="middle" font-size="16">🚲</text>
    <text x="303" y="66" text-anchor="middle" fill="#6B7280" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="500">Bicycle</text>
  </g>

  <!-- Input Field 1: Email / Phone -->
  <g transform="translate(24, 370)">
    <text x="0" y="0" fill="#A7F3D0" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600">Collector Email or Phone</text>
    <rect x="0" y="8" width="342" height="48" rx="12" fill="#182419" stroke="#1F3022" stroke-width="1"/>
    <text x="16" y="38" font-size="15">👤</text>
    <text x="44" y="38" fill="#F0FDF4" font-family="Inter, -apple-system, sans-serif" font-size="14">driver.kanishka@econexus.com</text>
  </g>

  <!-- Input Field 2: Password -->
  <g transform="translate(24, 452)">
    <text x="0" y="0" fill="#A7F3D0" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600">Password / PIN</text>
    <rect x="0" y="8" width="342" height="48" rx="12" fill="#182419" stroke="#1F3022" stroke-width="1"/>
    <text x="16" y="38" font-size="15">🔒</text>
    <text x="44" y="38" fill="#6B7280" font-family="Inter, -apple-system, sans-serif" font-size="14" letter-spacing="3">••••••••••••</text>
    <text x="312" y="38" font-size="14">👁️</text>
  </g>

  <!-- Options: Remember & Forgot Password -->
  <g transform="translate(24, 532)">
    <!-- Custom Checkbox -->
    <rect x="0" y="0" width="18" height="18" rx="5" fill="#F59E0B"/>
    <path d="M5 9L8 12L13 6" stroke="#0A0F0D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="26" y="14" fill="#6B7280" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="500">Remember this fleet device</text>

    <!-- Forgot link -->
    <text x="342" y="14" text-anchor="end" fill="#F59E0B" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600">Forgot PIN?</text>
  </g>

  <!-- Primary CTA Button (Collector Role Amber Accent) -->
  <g transform="translate(24, 580)">
    <!-- Button Glow Shadow -->
    <rect x="12" y="6" width="318" height="50" rx="14" fill="#F59E0B" fill-opacity="0.3" filter="blur(14px)"/>
    <!-- Button Background -->
    <rect x="0" y="0" width="342" height="52" rx="14" fill="#F59E0B"/>
    <text x="171" y="32" text-anchor="middle" fill="#0A0F0D" font-family="Inter, -apple-system, sans-serif" font-size="15" font-weight="700">Sign In to Driver Fleet →</text>
  </g>

  <!-- Biometric Quick Login Option -->
  <g transform="translate(135, 660)">
    <rect width="120" height="38" rx="19" fill="#111A14" stroke="#1F3022" stroke-width="1"/>
    <text x="24" y="24" font-size="14">⚡</text>
    <text x="44" y="24" fill="#A7F3D0" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="600">Face / Touch ID</text>
  </g>

  <!-- Footer Link -->
  <g transform="translate(195, 760)">
    <text x="0" y="0" text-anchor="middle" fill="#6B7280" font-family="Inter, -apple-system, sans-serif" font-size="13">
      New collector vehicle? <tspan fill="#F59E0B" font-weight="700">Register Partner Fleet</tspan>
    </text>
  </g>

  <!-- iOS Home Bar Indicator -->
  <rect x="128" y="826" width="134" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.2"/>
</svg>

