# Dev overrides: hot-reload via bind mounts, source-mapped volumes, verbose logging.
version: "3.9"

services:
  backend:
    build:
      target: development
    volumes:
      - ./backend/src:/app/src
    command: npm run dev
    environment:
      NODE_ENV: development

  ai-service:
    volumes:
      - ./ai-service/app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      ENV: development
